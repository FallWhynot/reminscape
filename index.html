<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reminscape</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121214'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23c9a24b'%3Er%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;0,9..144,650;1,9..144,420;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   reminscape — design tokens
   ============================================================ */
:root{
  --bg:#121214;
  --bg-raised:#17171a;
  --card:#1d1d21;
  --card-hover:#232328;
  --border:#2a2a2f;
  --border-soft:#232327;
  --text:#f2f0ec;
  --text-secondary:#a3a3aa;
  --text-tertiary:#6c6c74;
  --accent:#c9a24b;
  --accent-bright:#dab766;
  --accent-soft:rgba(201,162,75,.12);
  --accent-soft-strong:rgba(201,162,75,.22);
  --green:#4ade80;
  --danger:#e5626a;
  --danger-soft:rgba(229,98,106,.12);

  --c-berita:#6ea8fe;
  --c-motorsport:#f97a5c;
  --c-gayahidup:#c9a24b;
  --c-sastra:#b39ffb;
  --c-jurnalistik:#2dd4bf;

  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --radius-sm:3px;
  --radius-md:5px;
  --radius-lg:8px;
  --maxw:1180px;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}
::selection{background:var(--accent-soft-strong);color:var(--text);}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
@media (max-width:640px){.wrap{padding:0 18px;}}

/* ============================================================
   Header / navigation
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:50;
  background:rgba(18,18,20,.86);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
  height:72px;
}
.logo{
  font-family:var(--serif);
  font-style:italic;
  font-weight:560;
  font-size:1.55rem;
  letter-spacing:-0.01em;
  color:var(--text);
  display:flex;align-items:baseline;gap:8px;
}
.logo .dot{color:var(--accent);font-style:normal;}

.main-nav{
  display:flex;align-items:center;gap:2px;
}
.nav-link{
  padding:9px 15px;
  font-size:.905rem;
  color:var(--text-secondary);
  border-radius:var(--radius-sm);
  transition:color .15s ease, background .15s ease;
  white-space:nowrap;
  position:relative;
}
.nav-link:hover{color:var(--text);background:var(--card);}
.nav-link.active{color:var(--text);}
.nav-link.active::after{
  content:"";position:absolute;left:15px;right:15px;bottom:4px;height:2px;background:var(--accent);border-radius:2px;
}

.header-right{display:flex;align-items:center;gap:6px;}
.star-trigger{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text-tertiary);
  font-size:1.15rem;border-radius:50%;
  transition:color .2s ease, transform .3s ease;
}
.star-trigger:hover{color:var(--accent);transform:rotate(35deg);}
.star-trigger.is-admin{color:var(--accent);}

.hamburger{
  display:none;width:38px;height:38px;border:none;background:transparent;color:var(--text);
  align-items:center;justify-content:center;font-size:1.3rem;
}
.mobile-nav{display:none;flex-direction:column;padding:6px 0 14px;border-top:1px solid var(--border-soft);}
.mobile-nav .nav-link{padding:11px 4px;font-size:1rem;}

@media (max-width:900px){
  .main-nav{display:none;}
  .hamburger{display:flex;}
  .mobile-nav.open{display:flex;}
}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;font-size:.92rem;font-weight:600;
  border-radius:var(--radius-sm);border:1px solid transparent;
  transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:#161513;}
.btn-primary:hover{background:var(--accent-bright);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{background:var(--card);border-color:var(--text-tertiary);}
.btn-danger{background:transparent;color:var(--danger);border-color:transparent;}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:7px 13px;font-size:.82rem;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}

/* ============================================================
   Category chips
   ============================================================ */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.8rem;font-weight:600;color:var(--text-secondary);
}
.chip .swatch{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.chip[data-cat="Berita"] .swatch{background:var(--c-berita);}
.chip[data-cat="Motorsport"] .swatch{background:var(--c-motorsport);}
.chip[data-cat="Gaya Hidup"] .swatch{background:var(--c-gayahidup);}
.chip[data-cat="Sastra"] .swatch{background:var(--c-sastra);}
.chip[data-cat="Jurnalistik"] .swatch{background:var(--c-jurnalistik);}

/* ============================================================
   Layout: home
   ============================================================ */
.page-head{padding:44px 0 30px;}
.page-head h1{
  font-family:var(--serif);font-weight:560;font-size:2.15rem;margin:0 0 6px;letter-spacing:-0.01em;
}
.page-head p{color:var(--text-secondary);margin:0;font-size:.98rem;}

.content-grid{
  display:grid;grid-template-columns:1fr 320px;gap:44px;
  padding-bottom:80px;align-items:start;
}
@media (max-width:960px){
  .content-grid{grid-template-columns:1fr;}
}

/* Featured card */
.featured-card{
  display:block;position:relative;border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid var(--border);background:var(--card);
  margin-bottom:40px;
}
.featured-media{
  width:100%;aspect-ratio:16/8;background:linear-gradient(135deg,#1d1d21,#232328);
  background-size:cover;background-position:center;
  display:flex;align-items:flex-end;position:relative;
}
.featured-media::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(18,18,20,0) 30%, rgba(18,18,20,.55) 100%);
}
.featured-body{padding:26px 30px 30px;}
.featured-body .chip{margin-bottom:14px;}
.featured-body h2{
  font-family:var(--serif);font-weight:560;font-size:2rem;line-height:1.18;margin:0 0 12px;
  letter-spacing:-0.015em;
  transition:color .15s ease;
}
.featured-card:hover h2{color:var(--accent-bright);}
.featured-excerpt{color:var(--text-secondary);font-size:1.02rem;line-height:1.65;margin:0 0 18px;max-width:62ch;}
.meta-row{display:flex;align-items:center;gap:18px;color:var(--text-tertiary);font-size:.84rem;flex-wrap:wrap;}
.meta-row .meta-item{display:inline-flex;align-items:center;gap:6px;}
.meta-row svg{width:14px;height:14px;opacity:.75;}

/* Grid of post cards */
.post-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:22px;
}
@media (max-width:640px){.post-grid{grid-template-columns:1fr;}}

.post-card{
  display:flex;flex-direction:column;
  border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--card);overflow:hidden;
  transition:border-color .15s ease, background .15s ease;
}
.post-card:hover{border-color:#3a3a41;background:var(--card-hover);}
.post-card .thumb{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#1d1d21,#26262c);background-size:cover;background-position:center;}
.post-card .pc-body{padding:18px 19px 20px;display:flex;flex-direction:column;gap:10px;flex:1;}
.post-card h3{
  font-family:var(--serif);font-weight:540;font-size:1.18rem;line-height:1.3;margin:0;letter-spacing:-0.01em;
}
.post-card .excerpt{color:var(--text-secondary);font-size:.89rem;line-height:1.55;margin:0;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post-card .meta-row{font-size:.78rem;margin-top:2px;}

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar{display:flex;flex-direction:column;gap:20px;position:sticky;top:96px;}
.side-box{
  border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--card);padding:22px;
}
.side-box h4{
  margin:0 0 16px;font-size:.83rem;font-weight:600;color:var(--text-secondary);
}

/* visitor widget */
.visit-count{
  display:flex;align-items:baseline;gap:10px;margin-bottom:4px;
}
.visit-count .num{font-family:var(--serif);font-size:2.3rem;font-weight:560;letter-spacing:-0.02em;}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--green);font-weight:600;}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);position:relative;flex-shrink:0;
}
.live-dot::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--green);opacity:.5;
  animation:pulseDot 1.8s ease-out infinite;
}
@keyframes pulseDot{
  0%{transform:scale(.5);opacity:.55;}
  100%{transform:scale(2.2);opacity:0;}
}

/* about box */
.about-avatar{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#8a6d2c);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:600;color:#171512;font-size:1.15rem;
  margin-bottom:14px;
}
.about-box p{color:var(--text-secondary);font-size:.88rem;line-height:1.6;margin:0;}
.about-box .name{color:var(--text);font-weight:600;font-size:.95rem;margin-bottom:2px;}

/* popular list */
.popular-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.popular-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border-soft);
}
.popular-item:first-child{border-top:none;padding-top:0;}
.popular-rank{
  font-family:var(--serif);font-size:1.05rem;color:var(--text-tertiary);width:18px;flex-shrink:0;padding-top:1px;
}
.popular-info a{font-size:.88rem;font-weight:500;line-height:1.4;display:block;margin-bottom:4px;}
.popular-info a:hover{color:var(--accent);}
.popular-meta{font-size:.75rem;color:var(--text-tertiary);}
.empty-side{color:var(--text-tertiary);font-size:.85rem;}

/* ============================================================
   Empty state
   ============================================================ */
.empty-state{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:90px 20px 100px;gap:22px;
}
.empty-state svg{width:120px;height:120px;opacity:.9;}
.empty-state h2{font-family:var(--serif);font-weight:540;font-size:1.5rem;margin:0;}
.empty-state p{color:var(--text-secondary);font-size:.98rem;max-width:36ch;margin:0;line-height:1.6;}

/* ============================================================
   Article page
   ============================================================ */
.article-wrap{padding:40px 0 90px;}
.back-link{
  display:inline-flex;align-items:center;gap:7px;color:var(--text-secondary);font-size:.88rem;margin-bottom:26px;
  transition:color .15s ease;
}
.back-link:hover{color:var(--accent);}
.article-header{max-width:760px;margin:0 auto 30px;}
.article-header .chip{margin-bottom:16px;}
.article-header h1{
  font-family:var(--serif);font-weight:600;font-size:2.6rem;line-height:1.16;letter-spacing:-0.015em;margin:0 0 18px;
}
@media (max-width:640px){.article-header h1{font-size:1.9rem;}}
.article-media{
  max-width:900px;margin:0 auto 36px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);
}
.article-media img{width:100%;display:block;}
.article-body{
  max-width:700px;margin:0 auto;font-size:1.13rem;line-height:1.85;color:#dedcd6;
}
.article-body p{margin:0 0 26px;}
.article-divider{max-width:700px;margin:46px auto;height:1px;background:var(--border);}

.related-section{max-width:900px;margin:0 auto 60px;}
.related-section h4{font-size:.9rem;color:var(--text-secondary);margin:0 0 18px;font-weight:600;}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media (max-width:760px){.related-grid{grid-template-columns:1fr;}}

/* comments */
.comments-section{max-width:700px;margin:0 auto;}
.comments-section h4{font-size:1.15rem;font-weight:600;margin:0 0 26px;font-family:var(--serif);}
.comment-form{
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);padding:22px;margin-bottom:34px;
}
.form-row{display:flex;gap:14px;margin-bottom:14px;}
@media (max-width:520px){.form-row{flex-direction:column;}}
.field{flex:1;display:flex;flex-direction:column;gap:6px;}
.field label{font-size:.78rem;color:var(--text-secondary);font-weight:500;}
.field input,.field textarea{
  background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;color:var(--text);font-size:.92rem;resize:vertical;
  transition:border-color .15s ease;
}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none;}
.field .err{color:var(--danger);font-size:.76rem;min-height:14px;}
.field.has-error input,.field.has-error textarea{border-color:var(--danger);}

.comment-list{display:flex;flex-direction:column;gap:22px;}
.comment-item{display:flex;gap:13px;}
.c-avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:700;color:#fff;
}
.c-body{flex:1;}
.c-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.c-name{font-weight:600;font-size:.92rem;}
.c-date{font-size:.76rem;color:var(--text-tertiary);}
.c-text{color:var(--text-secondary);font-size:.92rem;line-height:1.6;}
.no-comments{color:var(--text-tertiary);font-size:.9rem;padding:10px 0 26px;}

/* ============================================================
   Toast
   ============================================================ */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#232328;border:1px solid var(--border);color:var(--text);
  padding:12px 20px;border-radius:var(--radius-md);font-size:.88rem;
  opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:10px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .tdot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* ============================================================
   Admin / Editor panel
   ============================================================ */
.admin-shell{padding:36px 0 90px;}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;flex-wrap:wrap;gap:14px;}
.admin-title{display:flex;align-items:center;gap:12px;}
.admin-title .badge{
  width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;
}
.admin-title h1{font-family:var(--serif);font-size:1.5rem;font-weight:560;margin:0;}
.admin-title p{margin:2px 0 0;font-size:.85rem;color:var(--text-secondary);}

.editor-grid{display:grid;grid-template-columns:1fr 300px;gap:30px;align-items:start;}
@media (max-width:900px){.editor-grid{grid-template-columns:1fr;}}

.editor-block{
  border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);
  padding:8px 34px 34px;
}
.title-input{
  width:100%;border:none;background:transparent;outline:none;
  font-family:var(--serif);font-size:2.1rem;font-weight:560;color:var(--text);
  padding:26px 0 14px;letter-spacing:-0.01em;
}
.title-input::placeholder{color:var(--text-tertiary);font-weight:500;}
.content-textarea{
  width:100%;border:none;background:transparent;outline:none;resize:vertical;
  font-family:var(--sans);font-size:1.08rem;line-height:1.8;color:var(--text);
  min-height:380px;padding-top:10px;
}
.content-textarea::placeholder{color:var(--text-tertiary);}

.editor-sidebar{display:flex;flex-direction:column;gap:18px;}
.settings-box{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);padding:20px;}
.settings-box h5{margin:0 0 16px;font-size:.8rem;color:var(--text-secondary);font-weight:600;}
.settings-field{margin-bottom:16px;}
.settings-field:last-child{margin-bottom:0;}
.settings-field label{display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:7px;}
.settings-field select,.settings-field input{
  width:100%;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;color:var(--text);font-size:.9rem;
}
.settings-field select:focus,.settings-field input:focus{border-color:var(--accent);outline:none;}
.img-preview{
  margin-top:10px;width:100%;aspect-ratio:16/9;border-radius:var(--radius-sm);border:1px dashed var(--border);
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);font-size:.78rem;overflow:hidden;
}

.manage-section{margin-top:52px;}
.manage-section h3{font-size:1rem;font-weight:600;margin:0 0 18px;color:var(--text-secondary);}
.manage-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--card);}
.manage-row{
  display:flex;align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid var(--border-soft);
}
.manage-row:last-child{border-bottom:none;}
.manage-thumb{width:52px;height:40px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#232328,#2c2c33);background-size:cover;background-position:center;flex-shrink:0;}
.manage-info{flex:1;min-width:0;}
.manage-info .t{font-size:.94rem;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.manage-info .m{font-size:.78rem;color:var(--text-tertiary);}
.manage-actions{display:flex;gap:8px;flex-shrink:0;}
.manage-empty{padding:34px 20px;text-align:center;color:var(--text-tertiary);font-size:.88rem;}

.exit-admin{margin-top:0;}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="#/" class="logo" data-nav-home>reminscape<span class="dot">.</span></a>
    <nav class="main-nav" id="mainNav"></nav>
    <div class="header-right">
      <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu">☰</button>
      <button class="star-trigger" id="starTrigger" title="✦" aria-label="Panel Editor">✦</button>
    </div>
  </div>
  <div class="wrap">
    <nav class="mobile-nav" id="mobileNav"></nav>
  </div>
</header>

<main id="app"></main>

<div class="toast" id="toast"><span class="tdot"></span><span id="toastMsg"></span></div>

<script>
(function(){
"use strict";

/* ============================================================
   Constants
   ============================================================ */
var CATEGORIES = ["Berita","Motorsport","Gaya Hidup","Sastra","Jurnalistik"];
var NAV_ITEMS = ["Beranda","Berita","Motorsport","Gaya Hidup","Sastra","Jurnalistik"];
var STORAGE_POSTS = "reminscape_posts_v1";
var STORAGE_VISITS = "reminscape_visits_v1";
var SESSION_FLAG = "reminscape_session_seen";

var MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

/* ============================================================
   Storage helpers
   ============================================================ */
function loadPosts(){
  try{
    var raw = localStorage.getItem(STORAGE_POSTS);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function savePosts(posts){
  localStorage.setItem(STORAGE_POSTS, JSON.stringify(posts));
}
function getVisits(){
  var v = parseInt(localStorage.getItem(STORAGE_VISITS) || "0", 10);
  return isNaN(v) ? 0 : v;
}
function bumpVisitsIfNewSession(){
  if(!sessionStorage.getItem(SESSION_FLAG)){
    var v = getVisits() + 1;
    localStorage.setItem(STORAGE_VISITS, String(v));
    sessionStorage.setItem(SESSION_FLAG, "1");
  }
  return getVisits();
}

/* ============================================================
   Utilities
   ============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function escapeHtml(str){
  return String(str == null ? "" : str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function nl2p(str){
  var parts = String(str||"").split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(Boolean);
  if(parts.length === 0) return "";
  return parts.map(function(p){
    return "<p>" + escapeHtml(p).replace(/\n/g,"<br>") + "</p>";
  }).join("");
}

function formatDate(ts){
  var d = new Date(ts);
  return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}

function readTime(content){
  var words = String(content||"").trim().split(/\s+/).filter(Boolean).length;
  var mins = Math.max(1, Math.ceil(words / 200));
  return mins + " menit baca";
}

function excerptOf(content, len){
  var plain = String(content||"").replace(/\s+/g," ").trim();
  if(plain.length <= len) return plain;
  return plain.slice(0, len).replace(/\s+\S*$/,"") + "…";
}

function initialsOf(name){
  var parts = String(name||"?").trim().split(/\s+/);
  var i = parts[0] ? parts[0][0] : "?";
  var j = parts.length > 1 ? parts[parts.length-1][0] : "";
  return (i+j).toUpperCase();
}

function colorFromString(str){
  var hash = 0;
  for(var i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
  var hue = Math.abs(hash) % 360;
  return "hsl(" + hue + ", 46%, 42%)";
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function catVar(cat){
  var map = {"Berita":"--c-berita","Motorsport":"--c-motorsport","Gaya Hidup":"--c-gayahidup","Sastra":"--c-sastra","Jurnalistik":"--c-jurnalistik"};
  return "var(" + (map[cat] || "--accent") + ")";
}

function commentCount(post){ return (post.comments||[]).length; }

var iconClock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';
var iconComment = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4A9 9 0 0 1 3 12a8.4 8.4 0 0 1 8.4-8.5 8.5 8.5 0 0 1 8.5 8"/><path d="M3 21l1.9-4.5"/></svg>';

/* ============================================================
   Toast
   ============================================================ */
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  var msgEl = document.getElementById("toastMsg");
  msgEl.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
}

/* ============================================================
   State
   ============================================================ */
var state = {
  posts: loadPosts(),
  visits: 0
};

/* ============================================================
   Router
   ============================================================ */
function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  if(h === "" ) return {view:"home", category:null};
  if(h === "admin") return {view:"admin"};
  if(h.indexOf("post/") === 0) return {view:"post", id: decodeURIComponent(h.slice(5))};
  if(h.indexOf("kategori/") === 0) return {view:"home", category: decodeURIComponent(h.slice(9))};
  return {view:"home", category:null};
}

function goTo(hash){ location.hash = hash; }

window.addEventListener("hashchange", render);

/* ============================================================
   Nav rendering
   ============================================================ */
function buildNav(){
  var route = parseHash();
  function itemHtml(name){
    var isActive = (route.view === "home") && (
      (name === "Beranda" && !route.category) ||
      (route.category === name)
    );
    var target = name === "Beranda" ? "#/" : "#/kategori/" + encodeURIComponent(name);
    return '<a href="' + target + '" class="nav-link' + (isActive ? " active" : "") + '">' + escapeHtml(name) + '</a>';
  }
  var html = NAV_ITEMS.map(itemHtml).join("");
  document.getElementById("mainNav").innerHTML = html;
  document.getElementById("mobileNav").innerHTML = html;

  var star = document.getElementById("starTrigger");
  star.classList.toggle("is-admin", route.view === "admin");
}

document.getElementById("starTrigger").addEventListener("click", function(){
  var route = parseHash();
  if(route.view === "admin"){ goTo("#/"); }
  else { goTo("#/admin"); }
});

document.getElementById("hamburgerBtn").addEventListener("click", function(){
  document.getElementById("mobileNav").classList.toggle("open");
});
document.getElementById("mobileNav").addEventListener("click", function(e){
  if(e.target.closest("a")) document.getElementById("mobileNav").classList.remove("open");
});

/* ============================================================
   Render: Home
   ============================================================ */
function renderHome(category){
  var posts = state.posts.slice().sort(function(a,b){ return b.timestamp - a.timestamp; });
  var filtered = category ? posts.filter(function(p){ return p.category === category; }) : posts;

  var app = document.getElementById("app");

  if(posts.length === 0){
    app.innerHTML =
      '<div class="wrap">' +
        emptyStateHtml() +
      '</div>';
    bindEmptyState();
    return;
  }

  var sidebarHtml = sidebarHtml_();

  var bodyHtml;
  if(category){
    if(filtered.length === 0){
      bodyHtml =
        '<div>' +
          '<div class="page-head"><h1>' + escapeHtml(category) + '</h1><p>Belum ada artikel pada kategori ini.</p></div>' +
        '</div>';
    } else {
      bodyHtml =
        '<div>' +
          '<div class="page-head"><h1>' + escapeHtml(category) + '</h1><p>' + filtered.length + ' artikel diterbitkan</p></div>' +
          '<div class="post-grid">' + filtered.map(postCardHtml).join("") + '</div>' +
        '</div>';
    }
  } else {
    var featured = filtered[0];
    var rest = filtered.slice(1);
    bodyHtml =
      '<div>' +
        featuredCardHtml(featured) +
        (rest.length ? '<div class="post-grid">' + rest.map(postCardHtml).join("") + '</div>' : '') +
      '</div>';
  }

  app.innerHTML =
    '<div class="wrap">' +
      '<div class="content-grid">' +
        bodyHtml +
        sidebarHtml +
      '</div>' +
    '</div>';
}

function emptyStateHtml(){
  return (
    '<div class="empty-state">' +
      '<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="34" y="26" width="132" height="108" rx="6" stroke="#3a3a41" stroke-width="2"/>' +
        '<path d="M34 46h132" stroke="#3a3a41" stroke-width="2"/>' +
        '<circle cx="48" cy="36" r="2.4" fill="#c9a24b"/>' +
        '<circle cx="58" cy="36" r="2.4" fill="#3a3a41"/>' +
        '<circle cx="68" cy="36" r="2.4" fill="#3a3a41"/>' +
        '<path d="M54 64h60M54 78h92M54 92h92M54 106h72" stroke="#2a2a2f" stroke-width="3" stroke-linecap="round"/>' +
        '<path d="M124 100l10 10 18-20" stroke="#c9a24b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>' +
      '</svg>' +
      '<h2>Belum ada artikel yang diterbitkan</h2>' +
      '<p>Ruang ini masih kosong. Mulai tulis catatan pertamamu tentang berita, balap, gaya hidup, sastra, atau jurnalistik.</p>' +
      '<button class="btn btn-primary" id="emptyWriteBtn">Tulis Artikel Pertama</button>' +
    '</div>'
  );
}
function bindEmptyState(){
  var btn = document.getElementById("emptyWriteBtn");
  if(btn) btn.addEventListener("click", function(){ goTo("#/admin"); });
}

function featuredCardHtml(post){
  var media = post.image
    ? 'style="background-image:url(\'' + escapeHtml(post.image) + '\')"'
    : 'style="background:linear-gradient(135deg,#1d1d21,#2a2a2f)"';
  return (
    '<a href="#/post/' + encodeURIComponent(post.id) + '" class="featured-card">' +
      '<div class="featured-media" ' + media + '></div>' +
      '<div class="featured-body">' +
        chipHtml(post.category) +
        '<h2>' + escapeHtml(post.title) + '</h2>' +
        '<p class="featured-excerpt">' + escapeHtml(excerptOf(post.content, 190)) + '</p>' +
        metaRowHtml(post) +
      '</div>' +
    '</a>'
  );
}

function postCardHtml(post){
  var thumb = post.image
    ? 'style="background-image:url(\'' + escapeHtml(post.image) + '\')"'
    : 'style="background:linear-gradient(135deg,#1d1d21,#26262c)"';
  return (
    '<a href="#/post/' + encodeURIComponent(post.id) + '" class="post-card">' +
      '<div class="thumb" ' + thumb + '></div>' +
      '<div class="pc-body">' +
        chipHtml(post.category) +
        '<h3>' + escapeHtml(post.title) + '</h3>' +
        '<p class="excerpt">' + escapeHtml(excerptOf(post.content, 110)) + '</p>' +
        metaRowHtml(post) +
      '</div>' +
    '</a>'
  );
}

function chipHtml(cat){
  return '<span class="chip" data-cat="' + escapeHtml(cat) + '"><span class="swatch"></span>' + escapeHtml(cat) + '</span>';
}

function metaRowHtml(post){
  return (
    '<div class="meta-row">' +
      '<span class="meta-item">' + formatDate(post.timestamp) + '</span>' +
      '<span class="meta-item">' + iconClock + readTime(post.content) + '</span>' +
      '<span class="meta-item">' + iconComment + commentCount(post) + ' komentar</span>' +
    '</div>'
  );
}

function sidebarHtml_(){
  var visits = state.visits;
  var posts = state.posts.slice().sort(function(a,b){ return commentCount(b) - commentCount(a); }).slice(0,5);

  var popularHtml = posts.length === 0
    ? '<p class="empty-side">Belum ada data popularitas.</p>'
    : '<ul class="popular-list">' + posts.map(function(p, idx){
        return (
          '<li class="popular-item">' +
            '<span class="popular-rank">' + (idx+1) + '</span>' +
            '<div class="popular-info">' +
              '<a href="#/post/' + encodeURIComponent(p.id) + '">' + escapeHtml(p.title) + '</a>' +
              '<span class="popular-meta">' + commentCount(p) + ' komentar</span>' +
            '</div>' +
          '</li>'
        );
      }).join("") + '</ul>';

  return (
    '<aside class="sidebar">' +
      '<div class="side-box">' +
        '<h4>Total Kunjungan</h4>' +
        '<div class="visit-count"><span class="num">' + visits.toLocaleString("id-ID") + '</span></div>' +
        '<span class="live-badge"><span class="live-dot"></span>Langsung</span>' +
      '</div>' +
      '<div class="side-box about-box">' +
        '<div class="about-avatar">R</div>' +
        '<div class="name">Penulis reminscape</div>' +
        '<p>Ruang pribadi untuk merekam berita, dunia balap, gaya hidup, sastra, dan catatan jurnalistik — ditulis apa adanya, disimpan seutuhnya.</p>' +
      '</div>' +
      '<div class="side-box">' +
        '<h4>Artikel Terpopuler</h4>' +
        popularHtml +
      '</div>' +
    '</aside>'
  );
}

/* ============================================================
   Render: Post detail
   ============================================================ */
function renderPost(id){
  var post = state.posts.find(function(p){ return p.id === id; });
  var app = document.getElementById("app");
  if(!post){
    app.innerHTML = '<div class="wrap article-wrap"><p>Artikel tidak ditemukan. <a href="#/" style="color:var(--accent)">Kembali ke beranda</a></p></div>';
    return;
  }

  var related = state.posts.filter(function(p){ return p.id !== post.id && p.category === post.category; })
    .sort(function(a,b){ return b.timestamp - a.timestamp; }).slice(0,3);

  var mediaHtml = post.image
    ? '<div class="article-media"><img src="' + escapeHtml(post.image) + '" alt="' + escapeHtml(post.title) + '"></div>'
    : '';

  var relatedHtml = related.length ? (
    '<div class="related-section">' +
      '<h4>Artikel terkait</h4>' +
      '<div class="related-grid">' + related.map(postCardHtml).join("") + '</div>' +
    '</div>'
  ) : '';

  app.innerHTML =
    '<div class="wrap article-wrap">' +
      '<a href="#/" class="back-link">← Kembali ke Beranda</a>' +
      '<div class="article-header">' +
        chipHtml(post.category) +
        '<h1>' + escapeHtml(post.title) + '</h1>' +
        metaRowHtml(post) +
      '</div>' +
      mediaHtml +
      '<div class="article-body">' + nl2p(post.content) + '</div>' +
      '<div class="article-divider"></div>' +
      relatedHtml +
      commentsSectionHtml(post) +
    '</div>';

  bindCommentForm(post.id);
}

function commentsSectionHtml(post){
  var comments = post.comments || [];
  var listHtml = comments.length === 0
    ? '<p class="no-comments">Belum ada komentar. Jadilah yang pertama menanggapi tulisan ini.</p>'
    : '<div class="comment-list">' + comments.map(commentItemHtml).join("") + '</div>';

  return (
    '<div class="comments-section">' +
      '<h4>Komentar (' + comments.length + ')</h4>' +
      '<form class="comment-form" id="commentForm" novalidate>' +
        '<div class="form-row">' +
          '<div class="field" id="fieldName">' +
            '<label for="cName">Nama</label>' +
            '<input type="text" id="cName" placeholder="Nama kamu">' +
            '<span class="err" id="errName"></span>' +
          '</div>' +
          '<div class="field" id="fieldEmail">' +
            '<label for="cEmail">Email</label>' +
            '<input type="text" id="cEmail" placeholder="email@contoh.com">' +
            '<span class="err" id="errEmail"></span>' +
          '</div>' +
        '</div>' +
        '<div class="field" id="fieldText" style="margin-bottom:14px;">' +
          '<label for="cText">Komentar</label>' +
          '<textarea id="cText" rows="3" placeholder="Tulis komentarmu di sini..."></textarea>' +
          '<span class="err" id="errText"></span>' +
        '</div>' +
        '<button type="submit" class="btn btn-primary">Kirim Komentar</button>' +
      '</form>' +
      listHtml +
    '</div>'
  );
}

function commentItemHtml(c){
  return (
    '<div class="comment-item">' +
      '<div class="c-avatar" style="background:' + colorFromString(c.name) + '">' + escapeHtml(initialsOf(c.name)) + '</div>' +
      '<div class="c-body">' +
        '<div class="c-head"><span class="c-name">' + escapeHtml(c.name) + '</span><span class="c-date">' + formatDate(c.timestamp) + '</span></div>' +
        '<div class="c-text">' + escapeHtml(c.text) + '</div>' +
      '</div>' +
    '</div>'
  );
}

function bindCommentForm(postId){
  var form = document.getElementById("commentForm");
  if(!form) return;
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = document.getElementById("cName").value.trim();
    var email = document.getElementById("cEmail").value.trim();
    var text = document.getElementById("cText").value.trim();

    var ok = true;
    ["fieldName","fieldEmail","fieldText"].forEach(function(id){ document.getElementById(id).classList.remove("has-error"); });
    document.getElementById("errName").textContent = "";
    document.getElementById("errEmail").textContent = "";
    document.getElementById("errText").textContent = "";

    if(!name){
      document.getElementById("fieldName").classList.add("has-error");
      document.getElementById("errName").textContent = "Nama wajib diisi";
      ok = false;
    }
    if(!email || !isValidEmail(email)){
      document.getElementById("fieldEmail").classList.add("has-error");
      document.getElementById("errEmail").textContent = "Email tidak valid";
      ok = false;
    }
    if(!text){
      document.getElementById("fieldText").classList.add("has-error");
      document.getElementById("errText").textContent = "Komentar tidak boleh kosong";
      ok = false;
    }
    if(!ok) return;

    var post = state.posts.find(function(p){ return p.id === postId; });
    if(!post) return;
    post.comments = post.comments || [];
    post.comments.unshift({ id: uid(), name: name, email: email, text: text, timestamp: Date.now() });
    savePosts(state.posts);
    showToast("Komentar terkirim");
    renderPost(postId);
  });
}

/* ============================================================
   Render: Admin
   ============================================================ */
function renderAdmin(){
  var app = document.getElementById("app");
  var catOptions = CATEGORIES.map(function(c){ return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join("");

  var posts = state.posts.slice().sort(function(a,b){ return b.timestamp - a.timestamp; });
  var manageHtml = posts.length === 0
    ? '<div class="manage-empty">Belum ada artikel yang diterbitkan.</div>'
    : posts.map(function(p){
        var thumbStyle = p.image ? 'style="background-image:url(\'' + escapeHtml(p.image) + '\')"' : 'style="background:linear-gradient(135deg,#232328,#2c2c33)"';
        return (
          '<div class="manage-row" data-id="' + escapeHtml(p.id) + '">' +
            '<div class="manage-thumb" ' + thumbStyle + '></div>' +
            '<div class="manage-info">' +
              '<div class="t">' + escapeHtml(p.title || "(Tanpa judul)") + '</div>' +
              '<div class="m">' + escapeHtml(p.category) + ' · ' + formatDate(p.timestamp) + ' · ' + commentCount(p) + ' komentar</div>' +
            '</div>' +
            '<div class="manage-actions">' +
              '<button class="btn btn-ghost btn-sm" data-action="view">Lihat</button>' +
              '<button class="btn btn-danger btn-sm" data-action="delete">Hapus</button>' +
            '</div>' +
          '</div>'
        );
      }).join("");

  app.innerHTML =
    '<div class="wrap admin-shell">' +
      '<div class="admin-topbar">' +
        '<div class="admin-title">' +
          '<div class="badge">✦</div>' +
          '<div><h1>Panel Editor</h1><p>Tulis dan kelola artikel reminscape</p></div>' +
        '</div>' +
        '<a href="#/" class="btn btn-ghost btn-sm">Kembali ke Situs</a>' +
      '</div>' +

      '<div class="editor-grid">' +
        '<div class="editor-block">' +
          '<input type="text" id="postTitle" class="title-input" placeholder="Tambahkan judul">' +
          '<textarea id="postContent" class="content-textarea" placeholder="Mulai menulis... (pisahkan paragraf dengan baris kosong)"></textarea>' +
        '</div>' +
        '<div class="editor-sidebar">' +
          '<div class="settings-box">' +
            '<h5>Pengaturan Artikel</h5>' +
            '<div class="settings-field">' +
              '<label for="postCategory">Kategori</label>' +
              '<select id="postCategory">' + catOptions + '</select>' +
            '</div>' +
            '<div class="settings-field">' +
              '<label for="postImage">Tautan gambar (opsional)</label>' +
              '<input type="text" id="postImage" placeholder="https://...">' +
              '<div class="img-preview" id="imgPreview">Pratinjau gambar</div>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-primary btn-block" id="publishBtn">Terbitkan</button>' +
        '</div>' +
      '</div>' +

      '<div class="manage-section">' +
        '<h3>Artikel Terbit (' + posts.length + ')</h3>' +
        '<div class="manage-list">' + manageHtml + '</div>' +
      '</div>' +
    '</div>';

  bindAdmin();
}

function bindAdmin(){
  var imgInput = document.getElementById("postImage");
  var preview = document.getElementById("imgPreview");
  imgInput.addEventListener("input", function(){
    var val = imgInput.value.trim();
    if(val){
      preview.style.backgroundImage = "url('" + val.replace(/'/g,"") + "')";
      preview.textContent = "";
    } else {
      preview.style.backgroundImage = "";
      preview.textContent = "Pratinjau gambar";
    }
  });

  document.getElementById("publishBtn").addEventListener("click", function(){
    var title = document.getElementById("postTitle").value.trim();
    var content = document.getElementById("postContent").value.trim();
    var category = document.getElementById("postCategory").value;
    var image = document.getElementById("postImage").value.trim();

    if(!title){ showToast("Judul wajib diisi"); document.getElementById("postTitle").focus(); return; }
    if(!content){ showToast("Konten wajib diisi"); document.getElementById("postContent").focus(); return; }

    var post = { id: uid(), title: title, content: content, category: category, image: image, timestamp: Date.now(), comments: [] };
    state.posts.unshift(post);
    savePosts(state.posts);
    showToast("Artikel diterbitkan");
    goTo("#/post/" + encodeURIComponent(post.id));
  });

  document.querySelectorAll(".manage-row").forEach(function(row){
    var id = row.getAttribute("data-id");
    row.querySelector('[data-action="view"]').addEventListener("click", function(){
      goTo("#/post/" + encodeURIComponent(id));
    });
    row.querySelector('[data-action="delete"]').addEventListener("click", function(){
      var post = state.posts.find(function(p){ return p.id === id; });
      var ok = confirm('Yakin ingin menghapus artikel "' + (post ? post.title : "") + '"?');
      if(!ok) return;
      state.posts = state.posts.filter(function(p){ return p.id !== id; });
      savePosts(state.posts);
      showToast("Artikel dihapus");
      renderAdmin();
    });
  });
}

/* ============================================================
   Master render
   ============================================================ */
function render(){
  state.posts = loadPosts();
  buildNav();
  var route = parseHash();
  window.scrollTo({top:0, behavior:"auto"});
  if(route.view === "admin") renderAdmin();
  else if(route.view === "post") renderPost(route.id);
  else renderHome(route.category);
}

/* ============================================================
   Init
   ============================================================ */
state.visits = bumpVisitsIfNewSession();
render();

})();
</script>
